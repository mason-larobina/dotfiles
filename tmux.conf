# Tmux configuration. Symlinked to ~/.tmux.conf (see link.sh).

# Prefix
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix
set -sg escape-time 0
set -g repeat-time 0

# Allow nvim to detect terminal focus/unfocus (to reload files).
set-option -g focus-events on

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Enable 256 colors, https://github.com/tmux/tmux/wiki/FAQ
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc"

# Window options.
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
set-option -g allow-rename on

# History.
set-option -g history-limit 10000

# Live reload config.
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Window commands.
bind-key C-a last-window
bind -r C-c new-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane commands.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind l select-pane -R
bind j select-pane -U
bind k select-pane -D

# Vim-like visual mode selections.
setw -g mode-keys vi
bind Escape copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Status bar (bottom). Dark background with flat, unpadded text on the right:
# hostname (blue), session name (sand), clock (near-white), separated by dim
# ASCII pipes. The left side is empty so the window list starts at the edge. The
# current window is a solid block and the last window (the one Ctrl-A Ctrl-A
# switches back to) is tinted sand instead of carrying the old '*' / '-' flags;
# attributes are cleared (no underline) and each format ends with #[default] so
# the highlight can't bleed past the segment. Color values are 256-color indices
# (colourNNN).
set -g status-bg colour234
set -g status-fg white
set -g status-left ''
set -g status-left-length 0
set -g status-right-length 60
set -g status-right '#[fg=colour110] #h #[fg=colour238]|#[fg=colour180] #S #[fg=colour238]|#[fg=colour252] %Y-%m-%d %H:%M '
set -g status-interval 60
set -g status-justify left
set -g status-position bottom
set-window-option -g window-status-format ' #{?window_last_flag,#[fg=colour180],#[fg=colour244]}#I:#W #[default]'
set-window-option -g window-status-current-format '#[none,bg=colour161,fg=white] #I:#W #[default]'

# https://pi.dev/docs/latest/tmux
set -g extended-keys on
set -g extended-keys-format csi-u
