# Alacritty terminal configuration.
# Symlinked to ~/.config/alacritty/alacritty.toml (see link.sh).

[general]
live_config_reload = true

[font]
size = 12

# All four variants share one Nerd Font family so glyphs render consistently
# regardless of bold/italic styling.
[font.bold]
family = "Terminess Nerd Font"
[font.bold_italic]
family = "Terminess Nerd Font"
[font.italic]
family = "Terminess Nerd Font"
[font.normal]
family = "Terminess Nerd Font"

[mouse]
hide_when_typing = true

[scrolling]
history = 1000

[window]
decorations = "none"
dynamic_padding = true
dynamic_title = true
startup_mode = "Maximized"
padding = { x = 12, y = 12 }
